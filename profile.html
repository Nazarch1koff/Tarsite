<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Профиль</title>

    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

    <!-- Фон профиля -->
    <div class="profile-banner">

        <img id="bannerImage" src="img/default-banner.jpg">

        <div class="banner-overlay"></div>

    </div>

    <!-- Верхняя навигация -->
    <header class="navbar glass">

        <div class="logo">

            <img id="userAvatar" src="img/default-avatar.png">

            <div>

                <h2 id="userName">Пользователь</h2>

                <span>Portfolio</span>

            </div>

        </div>

        <nav>

            <a href="../index.html">Главная</a>
            <a href="#">Проекты</a>
            <a href="#">Посты</a>
            <a href="../timer.html">Расписание</a>
            <a href="#">Обо мне</a>
            <a href="#">Контакты</a>

        </nav>

    </header>

    <!-- Главный экран -->
    <section class="hero">

        <!-- Левая карточка -->

        <div class="glass intro">

            <p>👋 Добро пожаловать</p>

            <h1 id="heroName">

                Назар

            </h1>

            <p id="heroDescription">

                Инженер. Создаю решения,
                которые упрощают сложное.

            </p>

            <div class="buttons">

                <button>

                    Мои проекты

                </button>

                <button class="transparent">

                    Связаться

                </button>

            </div>

        </div>

        <!-- Центр -->

        <div class="centerPhoto">

            <img id="heroAvatar"
                 src="img/default-avatar.png">

        </div>

        <!-- Таймер -->

        <div class="glass timerCard">

            <h3>Расписание</h3>

            <p>До конца рабочего дня</p>

            <div class="timer">

                03:47:32

            </div>

            <button>

                Перейти к расписанию →

            </button>

        </div>

    </section>

    <!-- Контент -->

    <section class="content">

        <div class="left">

            <div class="glass">

                <h2>Мои проекты</h2>

                <div class="projects">

                </div>

            </div>

            <div class="glass">

                <h2>Контакты</h2>

            </div>

        </div>

        <div class="right">

            <div class="glass">

                <h2>Последние посты</h2>

                <div id="posts"></div>

            </div>

            <div class="glass">

                <h2>Документы</h2>

            </div>

        </div>

    </section>

</body>

</html>
