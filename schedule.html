<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AEROSTAR Timer</title>

    <link rel="stylesheet" href="css/schedule.css">

</head>

<body class="green">

<div class="background"></div>

<header>

    <a href="index.html" class="backButton">
        ← На главную
    </a>

    <h2>AEROSTAR TIMER</h2>

</header>

<main>

    <div class="card">

        <img src="img/cat.gif" class="cat" alt="Cat">

        <div id="clock"></div>

        <h1 id="title">
            Загрузка...
        </h1>

        <div id="timer">
            00:00:00
        </div>

        <div class="progress">

            <div class="progressBar" id="progressBar"></div>

        </div>

        <div id="status">

        </div>

        <div class="info">

            <div>

                <h3>Рабочее время</h3>

                <p>09:00 - 18:00</p>

            </div>

            <div>

                <h3>Обед</h3>

                <p>13:00 - 14:00</p>

            </div>

        </div>

    </div>

</main>

<script src="js/schedule.js"></script>

</body>

</html>
