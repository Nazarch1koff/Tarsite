<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Профиль</title>

<link rel="stylesheet" href="css/profile.css">

<script defer src="js/profile.js"></script>

</head>

<body>

<div class="banner">

<div class="bannerBlur"></div>

</div>

<div class="profileCard">

<img id="avatar">

<div class="info">

<h1 id="name"></h1>

<p id="description"></p>

</div>

</div>

<div class="container">

    <div class="leftColumn">

        <section class="projects glass">

            <h2>🚀 Мои проекты</h2>

            <div class="projectGrid">

                <div class="project">

                    <img src="img/projects/project1.jpg">

                    <h3>Ventilation Calculator</h3>

                    <p>Инженерный проект.</p>

                </div>

                <div class="project">

                    <img src="img/projects/project2.jpg">

                    <h3>Portfolio</h3>

                    <p>Мой сайт.</p>

                </div>

                <div class="project">

                    <img src="img/projects/project3.jpg">

                    <h3>Game</h3>

                    <p>Мини-игра.</p>

                </div>

            </div>

        </section>

        <section class="posts glass">

            <h2>📰 Посты</h2>

            <textarea
                id="postText"
                placeholder="Что нового?"></textarea>

            <button id="publish">

                Опубликовать

            </button>

            <div id="posts"></div>

        </section>

    </div>

    <div class="rightColumn">

        <div class="glass profileInfo">

            <h2>📋 О профиле</h2>

            <p><b>📅 На сайте:</b> 29.07.2026</p>

            <p><b>🚀 Проектов:</b> 3</p>

            <p><b>📝 Постов:</b> 0</p>

            <p><b>🌐 Язык:</b> Русский</p>

        </div>

        <div class="glass contacts">

            <h2>📞 Контакты</h2>

            <a href="#">GitHub</a>

            <a href="#">Telegram</a>

            <a href="#">Discord</a>

            <a href="#">Steam</a>

        </div>

    </div>


<img src="img/projects/project2.jpg">

<h3>Проект 2</h3>

<p>Описание проекта</p>

</div>

<div class="project">

<img src="img/projects/project3.jpg">

<h3>Проект 3</h3>

<p>Описание проекта</p>

</div>

</div>

</section>

<section class="posts">

<h2>📰 Посты</h2>

<div class="postCreator">

<textarea
id="postText"
placeholder="О чем думаете?"></textarea>

<button id="publish">

Опубликовать

</button>

</div>

<div id="posts"></div>

</section>

</div>
