<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Профиль</title>

    <link rel="stylesheet" href="css/profile.css">

    <script defer src="js/profile.js"></script>

</head>

<body>

    <!-- Обложка -->

    <header class="banner"></header>

    <!-- Карточка профиля -->

    <section class="profileCard glass">

        <img id="avatar" src="img/default-avatar.png">

        <div class="info">

            <h1 id="name">Пользователь</h1>

            <p id="description">
                Пока описание отсутствует.
            </p>

        </div>

    </section>

    <!-- Контент -->

    <main class="container">

        <!-- Левая часть -->

        <div class="leftColumn">

            <!-- Проекты -->

            <section class="glass">

                <h2>🚀 Мои проекты</h2>

                <div class="projectGrid">

                    <div class="project">

                        <img src="img/projects/project1.jpg">

                        <h3>Ventilation Project</h3>

                        <p>Описание проекта</p>

                    </div>

                    <div class="project">

                        <img src="img/projects/project2.jpg">

                        <h3>Portfolio Website</h3>

                        <p>Описание проекта</p>

                    </div>

                    <div class="project">

                        <img src="img/projects/project3.jpg">

                        <h3>Mini Game</h3>

                        <p>Описание проекта</p>

                    </div>

                </div>

            </section>

            <!-- Посты -->

            <section class="glass">

                <h2>📰 Посты</h2>

                <textarea
                    id="postText"
                    placeholder="Что нового?"></textarea>

                <button id="publish">

                    Опубликовать

                </button>

                <div id="posts"></div>

            </section>

        </div>

        <!-- Правая колонка -->

        <aside class="rightColumn">

            <div class="glass profileInfo">

                <h2>📋 О профиле</h2>

                <p>📅 На сайте:
                    <span id="joinDate">
                        Сегодня
                    </span>
                </p>

                <p>🚀 Проектов:
                    <span id="projectCount">3</span>
                </p>

                <p>📰 Постов:
                    <span id="postCount">0</span>
                </p>

            </div>

            <div class="glass contacts">

                <h2>📞 Контакты</h2>

                <a href="#">GitHub</a>
                <a href="#">Telegram</a>
                <a href="#">Discord</a>
                <a href="#">Steam</a>

            </div>

        </aside>

    </main>

</body>

</html>
